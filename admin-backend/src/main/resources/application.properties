spring.application.name=exchange-admin-backend
server.port=${ADMIN_SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/exchange_mvp}
spring.datasource.username=${DB_USERNAME:exchange}
spring.datasource.password=${DB_PASSWORD:exchange}
spring.sql.init.mode=never

spring.jackson.generator.write-bigdecimal-as-plain=true

app.jwt.secret=${JWT_SECRET:change-this-local-dev-secret-change-before-production}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
app.rate-limit.login.capacity=${ADMIN_LOGIN_RATE_LIMIT_CAPACITY:5}
app.rate-limit.login.window-seconds=${ADMIN_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
