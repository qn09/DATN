spring.application.name=exchange-mvp

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/exchange_mvp}
spring.datasource.username=${DB_USERNAME:exchange}
spring.datasource.password=${DB_PASSWORD:exchange}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jackson.generator.write-bigdecimal-as-plain=true

app.jwt.secret=${JWT_SECRET:change-this-local-dev-secret-change-before-production}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

app.fiat-deposit.gateway=${FIAT_DEPOSIT_GATEWAY:MOCK_DOMESTIC}
app.fiat-deposit.webhook-secret=${FIAT_DEPOSIT_WEBHOOK_SECRET:change-this-fiat-webhook-secret-before-production}
app.fiat-deposit.callback-max-age-seconds=${FIAT_DEPOSIT_CALLBACK_MAX_AGE_SECONDS:300}

app.binance.market-data-base-url=${BINANCE_MARKET_DATA_BASE_URL:https://data-api.binance.vision}
app.binance.stream-base-url=${BINANCE_STREAM_BASE_URL:wss://stream.binance.com:9443/ws}

app.rate-limit.global.capacity=${GLOBAL_RATE_LIMIT_CAPACITY:20000}
app.rate-limit.global.window-seconds=${GLOBAL_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.ip.capacity=${IP_RATE_LIMIT_CAPACITY:300}
app.rate-limit.ip.window-seconds=${IP_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.login.capacity=${LOGIN_RATE_LIMIT_CAPACITY:5}
app.rate-limit.login.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
